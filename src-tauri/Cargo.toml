[package]
name = "assetdaemon"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "assetdaemon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lz4_flex = "0.11"
lzma-rs = { version = "0.3", features = ["raw_decoder"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "dds", "tga"] }
base64 = "0.22"
indexmap = "2"
md-5 = "0.10"
tokio = { version = "1", features = ["sync"] }
bcdec_rs = "0.2.0"
sysinfo = "0.31"
once_cell = "1"
rusqlite = { version = "0.31", features = ["bundled-full"] }
chrono = "0.4"

# ============================================
# dev profile used by bun tauri dev
# Optimized for fast incremental compilation
# ============================================
[profile.dev]
# Rebuild only changed code
incremental = true
# Improve incremental cache hit rate
codegen-units = 1
# Disable LTO during development for faster links
lto = false
# Split debug info to reduce link cost
split-debuginfo = "unpacked"

# ============================================
# release profile used by bun tauri build
# Optimized for smaller and faster final binaries
# ============================================
[profile.release]
# ThinLTO balances link time and optimization quality
lto = "thin"
# Use one codegen unit for whole-program optimization
codegen-units = 1
# Strip debug symbols to reduce package size
strip = true
# Keep unwind on panic: the app relies on catch_unwind + a global panic hook to
# contain panics in background tasks, write panic logs to disk, and notify the
# user. panic = "abort" would kill the whole app without any log on any panic.
